<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무구정광대다라니경 AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --bg-0:#0e1016; --bg-1:#171a24; --vitrine:#1c202c; --line:#33384a;
    --gold:#c9a24a; --gold-bright:#eccd7c; --jade:#5c8f7c; --ink:#f4efe2; --ink-dim:#a6a394;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,162,74,0.10), transparent 60%), var(--bg-0);
    color:var(--ink); font-family:'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px 40px;
  }
  .page{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; }
  .backlink{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim);
    text-decoration:none; font-size:13px; font-weight:500;
  }
  .backlink:hover{ color:var(--gold); }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:0.16em; color:var(--gold); text-transform:uppercase; text-align:center; }
  h1{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:clamp(28px, 6vw, 38px);
    text-align:center; margin:0; text-wrap:balance;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ text-align:center; color:var(--ink-dim); font-size:14px; margin:-8px 0 4px; }
  .vitrine{
    position:relative; border-radius:18px;
    background: radial-gradient(ellipse 60% 45% at 50% 38%, rgba(201,162,74,0.16), transparent 70%), var(--vitrine);
    border:1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 24px 48px -20px rgba(0,0,0,0.6);
    padding:6px; overflow:hidden;
  }
  .vitrine::before{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:18px;
    box-shadow:inset 0 0 0 1px rgba(201,162,74,0.08);
  }
  model-viewer{
    width:100%; height:min(64vw, 420px); min-height:300px; border-radius:13px; background:transparent;
    --poster-color:transparent; --progress-bar-color:var(--gold); --progress-bar-height:3px;
  }
  .ar-cta{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:center; gap:7px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold)); border:none; border-radius:999px;
    padding:10px 20px; font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:13.5px;
    color:#211a08; box-shadow:0 8px 20px -8px rgba(201,162,74,0.7); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .ar-cta svg{ flex:none; }
  .ar-cta{z-index:20;min-width:156px;justify-content:center;text-decoration:none;}
  .ar-cta:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  .ar-cta.ar-unavailable{background:#343847;color:#d7d3c8;box-shadow:none;cursor:default;}
  .ar-thumb{width:1px;height:1px;opacity:.01;position:absolute;pointer-events:none;}
  .hint{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; background:var(--bg-1);
    border:1px solid var(--line); border-radius:12px; color:var(--ink-dim); font-size:13px; line-height:1.55;
  }
  .hint svg{flex:none; margin-top:2px; color:var(--jade);}
  .hint b{color:var(--ink); font-weight:600;}
  footer{ text-align:center; color:var(--ink-dim); font-size:12px; letter-spacing:0.04em; padding-top:4px; }
  footer .brand{color:var(--gold); font-weight:600;}
  @media (prefers-reduced-motion: reduce){ model-viewer{ --animation-play-state:paused; } }
</style>
</head>
<body>

<div class="page">
  <a class="backlink" href="../">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    전체 유물 목록
  </a>
  <div class="eyebrow">Gyeongju Trip · AR Preview</div>
  <h1>무구정광대다라니경</h1>
  <p class="subtitle">사진을 바탕으로 재현한 두루마리 3D 모델</p>

  <div class="vitrine">
    <model-viewer
      id="dharani"
      src="model.glb"
      alt="무구정광대다라니경 3D 모델"
      ar
      ar-modes="scene-viewer quick-look webxr"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      shadow-softness="0.9"
      exposure="1.05"
      environment-image="neutral"
      camera-orbit="0deg 25deg 105%"
      min-camera-orbit="auto 0deg auto"
      max-camera-orbit="auto 100deg auto"
      interaction-prompt="none"
    >
    </model-viewer>
    <button id="arControl" type="button" class="ar-cta" aria-describedby="model-status">AR로 보기</button>
  </div>

  <div class="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>화면을 드래그해서 회전하고, 두 손가락으로 확대해 글씨를 살펴보세요. AR로 보기 버튼을 누르면 실제 공간에 놓아볼 수 있어요.</span>
  </div>

  <p id="model-status" role="status" style="margin:0;text-align:center;color:var(--ink-dim);font-size:13px;line-height:1.6">3D 모델을 불러오는 중입니다.</p>

  <footer>제작 · <span class="brand">경주트립</span></footer>
</div>

<script type="module">
const viewer = document.querySelector('model-viewer');
const status = document.querySelector('#model-status');
const arControl = document.querySelector('#arControl');
const ua = navigator.userAgent || '';
const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) {
  arControl.textContent = 'iPhone AR 준비 중';
  arControl.classList.add('ar-unavailable');
  arControl.addEventListener('click', () => alert('현재 3D와 일치하는 iPhone용 AR 파일을 준비 중입니다. 다른 모델이 잘못 열리지 않도록 AR 실행을 막아두었습니다.'));
} else {
  arControl.addEventListener('click', async () => {
    try { await viewer.activateAR(); }
    catch (error) { status.textContent = 'ARCore 지원 Android의 Chrome에서 다시 열어주세요.'; }
  });
}
viewer.addEventListener('load', () => {
  status.textContent = isIOS
    ? '현재 3D와 일치하는 iPhone용 AR 파일을 준비 중입니다. 3D 미리보기는 정상 이용할 수 있어요.'
    : (viewer.canActivateAR ? 'AR로 보기 버튼을 눌러 실제 공간에 배치해보세요.' : 'ARCore 지원 Android의 Chrome에서 이용해 주세요.');
});
viewer.addEventListener('error', () => { status.textContent = '모델을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해주세요.'; });
viewer.addEventListener('ar-status', (event) => {
  if (event.detail.status === 'failed') status.textContent = 'AR을 시작하지 못했어요. 휴대폰 기본 브라우저로 다시 열어주세요.';
});
</script>
</body>
</html>
