<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경주트립 · 유물 AR 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0e1016; --bg-1:#171a24; --vitrine:#1c202c; --line:#33384a;
    --gold:#c9a24a; --gold-bright:#eccd7c; --jade:#5c8f7c; --ink:#f4efe2; --ink-dim:#a6a394;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,162,74,0.10), transparent 60%), var(--bg-0);
    color:var(--ink); font-family:'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 16px 48px;
  }
  .page{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:22px; }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:0.16em; color:var(--gold); text-transform:uppercase; text-align:center; }
  h1{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:clamp(28px, 6vw, 36px);
    text-align:center; margin:0; text-wrap:balance;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ text-align:center; color:var(--ink-dim); font-size:14px; margin:-10px 0 4px; }

  .list{ display:flex; flex-direction:column; gap:14px; }

  .card{
    position:relative;
    display:flex; align-items:center; gap:16px;
    padding:16px 18px;
    border-radius:16px;
    text-decoration:none;
    background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(201,162,74,0.10), transparent 65%), var(--vitrine);
    border:1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 16px 32px -18px rgba(0,0,0,0.55);
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:active{ transform: scale(0.98); }

  .emblem{
    flex:none;
    width:52px; height:52px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, rgba(201,162,74,0.18), rgba(201,162,74,0.04));
    border:1px solid rgba(201,162,74,0.35);
    color:var(--gold-bright);
    font-size:22px;
  }

  .card-body{ flex:1; min-width:0; }
  .card-title{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:17px; color:var(--ink);
    margin:0 0 3px;
  }
  .card-desc{
    margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-dim);
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }

  .chevron{ flex:none; color:var(--ink-dim); }

  .hint{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; background:var(--bg-1);
    border:1px solid var(--line); border-radius:12px; color:var(--ink-dim); font-size:12.5px; line-height:1.55;
    margin-top:2px;
  }
  .hint svg{flex:none; margin-top:2px; color:var(--jade);}

  footer{ text-align:center; color:var(--ink-dim); font-size:12px; letter-spacing:0.04em; padding-top:4px; }
  footer .brand{color:var(--gold); font-weight:600;}
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow">Gyeongju Trip</div>
  <h1>유물 AR 아카이브</h1>
  <p class="subtitle">보고 싶은 유물을 골라보세요</p>

  <div class="list">

    <!-- ITEM: 신라 금관 -->
    <a class="card" href="crown/">
      <div class="emblem">👑</div>
      <div class="card-body">
        <p class="card-title">신라 금관</p>
        <p class="card-desc">3D 스캔 기반 디지털 복원 모델</p>
      </div>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <!-- ITEM: 터번 쓴 토우 -->
    <a class="card" href="toou/">
      <div class="emblem">🗿</div>
      <div class="card-body">
        <p class="card-title">터번 쓴 토우</p>
        <p class="card-desc">신라시대 · 서역인과의 교류를 보여주는 토우</p>
      </div>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <!--
      새 유물을 추가할 때: 위의 <a class="card" ...>...</a> 블록 하나를
      복사해서 여기 붙여넣고, href/emblem(이모지)/제목/설명만 바꾸면 됩니다.
    -->

  </div>

  <div class="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>유물을 선택하면 3D 모델을 회전해보고, 카메라 버튼으로 실제 공간에 놓아볼 수 있어요.</span>
  </div>

  <footer>제작 · <span class="brand">경주트립</span></footer>
</div>

</body>
</html>
