<body><main><a href="../">← 3D·AR로 보기</a><h1>선덕여왕 수정 전후</h1>
<p class="note">v5 → v6 · 얼굴·턱·목과 들고 있는 손을 다시 만들고, 머리카락과 복식 뒷면을 보완했습니다. 아래는 같은 카메라·조명에서 실제 GLB를 렌더한 이미지입니다.</p>
<h2>얼굴 확대</h2><div class="pair"><figure><img src="queen_v5_face.jpg" alt="수정 전 얼굴: 턱 아래 사진 경계"><figcaption>수정 전 · v5</figcaption></figure><figure><img src="queen_v6_face.jpg" alt="수정 후 얼굴: 부드러운 미소와 연결된 턱"><figcaption class="after">수정 후 · v6</figcaption></figure></div>
<h2>얼굴 옆면</h2><div class="pair"><figure><img loading="lazy" src="queen_v5_face_side.jpg" alt="수정 전 얼굴 옆면"><figcaption>수정 전 · v5</figcaption></figure><figure><img loading="lazy" src="queen_v6_face_side.jpg" alt="수정 후 얼굴 옆면"><figcaption class="after">수정 후 · v6</figcaption></figure></div>
<h2>손</h2><div class="pair"><figure><img loading="lazy" src="queen_v5_hand_compare.jpg" alt="수정 전 뭉개진 손"><figcaption>수정 전 · v5</figcaption></figure><figure><img loading="lazy" src="queen_v6_hand.jpg" alt="수정 후 다섯 손가락"><figcaption class="after">수정 후 · v6</figcaption></figure></div>
<h2>복식 뒷면</h2><div class="pair"><figure><img loading="lazy" src="queen_v5_rear_compare.jpg" alt="수정 전 복식 뒷면"><figcaption>수정 전 · v5</figcaption></figure><figure><img loading="lazy" src="queen_v6_rear.jpg" alt="수정 후 붉은 비단과 검정 금색 자수"><figcaption class="after">수정 후 · v6</figcaption></figure></div>
<p class="note">드라마 사진과 의상 사진에서 분위기를 참고한 창작용 캐릭터입니다. 생성한 질감을 실제 3D 형상에 적용했습니다. 어깨·옆선의 일부 원본 질감 경계와 배 위에 놓인 손은 추가 보완 여지가 있으며, 휴대폰 AR 실기기 검수는 아직 하지 않았습니다.</p>
