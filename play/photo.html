<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>불상의 미소 · 경주트립 포토체험</title><meta name="description" content="카메라 위에 불상 얼굴을 띄워 위치와 크기를 맞추는 창작 포토체험."><link rel="stylesheet" href="./style.css"><link rel="icon" href="./favicon.svg"><script type="module" src="./photo.js"></script></head><body><header class="mast"><a class="brand" href="./?tour=bulguksa">GYEONGJU TRIP<span>경주트립 · 포토체험</span></a><a class="back-link" href="./?tour=bulguksa">소원 마당으로 ↗</a></header><main class="photo-shell"><div class="heading"><div><p class="eyebrow">SMILE OF SILLA</p><h1>불상의 미소, 나의 한 장.</h1><p>카메라를 켜고 구도를 잡은 뒤 얼굴을 띄워 주세요.</p></div></div><div class="photo-stage"><canvas id="photo" width="900" height="1200" aria-label="카메라 포토체험 화면"></canvas><div id="camera-cover" class="camera-cover"><img src="./assets/buddha.webp" alt="신라 불상에서 영감을 얻은 창작 얼굴"><button id="start-camera" class="primary">카메라 켜기</button><p id="camera-message">브라우저에서 카메라 사용을 허용해 주세요.<br>얼굴 이미지는 카메라가 켜진 뒤 따로 띄울 수 있어요.</p></div></div><div class="photo-controls stack"><div class="row"><button id="show-head" class="primary" disabled>얼굴 띄우기</button><button id="switch-camera" disabled>카메라 전환</button></div><div class="card"><label for="head-size">얼굴 크기</label><input id="head-size" type="range" min="120" max="780" value="380"><div class="row"><button id="reset-head">가운데 맞추기</button><button id="toggle-mirror" aria-pressed="false">좌우 반전</button></div><p class="small" style="margin:10px 0 0">한 손가락으로 얼굴을 옮기고, 두 손가락으로 크기를 맞춰 보세요. 자동 얼굴 추적 없이 지정한 위치에 유지돼요.</p></div><button id="capture" class="gold" disabled>사진 찍고 저장</button><p class="small">신라 불상에서 영감을 얻은 창작 포토필터예요. 석굴암 본존불의 실제 3D 스캔이 아니에요. 카메라 영상과 사진은 서버로 보내지 않아요.</p></div></main><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"></dialog><video id="camera" playsinline muted autoplay class="hidden"></video></body></html>
