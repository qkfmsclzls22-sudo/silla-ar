name: Complete Silla AR model upload
on:
  push:
    branches:
      - codex/seondeok-transfer-f5d9872
    paths:
      - .github/workflows/seondeok-transfer.yml
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'qkfmsclzls22-sudo/silla-ar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and assemble crown with side pendants
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo = "qkfmsclzls22-sudo/silla-ar"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          api = "https://api.github.com/repos/" + repo + "/git/blobs"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          def read_blob(sha):
              with urllib.request.urlopen(urllib.request.Request(api + "/" + sha, headers=headers), timeout=120) as response:
                  data = base64.b64decode(json.load(response)["content"])
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == sha
              return data
          source = read_blob("f1959f5253be0ad13537fa0dd57a8b2f5416248a")
          delta = read_blob("64ca92dcc53bdec13b18528a64e6248ea951631a")
          assert len(source) == 21708136 and len(delta) == 657720
          data = delta[:297072] + source[293720:293720 + 11549908] + delta[297072:]
          assert len(data) == 12207628
          assert hashlib.sha256(data).hexdigest() == "f2403497e154c87df5426389e640312e8661141eaf0a807f7d1204f71f23e5e1"
          payload = json.dumps({"encoding": "base64", "content": base64.b64encode(data).decode()}).encode()
          with urllib.request.urlopen(urllib.request.Request(api, data=payload, headers=headers, method="POST"), timeout=180) as response:
              result = json.load(response)
          assert result["sha"] == "9ac9b0d6d22ed7a4d48406101829851ebc62e1b2"
          print("Verified crown with two side pendants: " + result["sha"] + " (" + str(len(data)) + " bytes)")
          PY
